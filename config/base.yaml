project:
  seed: 20260101
  ann_factor: 365

periods:
  history_start: "2014-01-01"
  dev_start: "2015-01-01"
  dev_end: "2022-12-31"
  test_start: "2023-01-01"
  lab_train_end: "2020-12-31"

data:
  assets_dir: config/assets
  rates_dir: config/rates
  universe: [BTC, ETH]
  binance_base_urls: ["https://api.binance.com", "https://data-api.binance.vision"]

asset_classes:
  crypto:
    calendar: continuous
    outlier_abs_return: 0.40
    trade_bps: 15.0
    leverage:
      instrument: spot_margin
      maintenance_margin: 0.10
      max_leverage: 2.0
  etf:
    calendar: business
    outlier_abs_return: 0.15
    trade_bps: 3.0
    leverage:
      instrument: margin_account
      maintenance_margin: 0.25
      max_leverage: 2.0
  future:
    calendar: business
    outlier_abs_return: 0.20
    trade_bps: 2.0
    leverage:
      instrument: future
      maintenance_margin: 0.08
      max_leverage: 3.0
  synthetic:
    calendar: continuous
    outlier_abs_return: 0.50
    trade_bps: 15.0
    leverage:
      instrument: spot_margin
      maintenance_margin: 0.10
      max_leverage: 2.0
  commodity:
    calendar: business
    outlier_abs_return: 0.20
    trade_bps: 5.0
    leverage:
      instrument: ETF_spot
      maintenance_margin: 0.25
      max_leverage: 1.0

exposure:
  w_min: 0.20
  w_max: 1.00
  buffer: 0.10
  drift: false

costs:
  trade_bps_multipliers: [0.3333, 1.0, 2.0]
  fin_spread_annual: 0.05
  fin_spread_sensitivity: [0.02, 0.05, 0.10]
  cash_yield: true

benchmarks:
  vol_halflife: 20
  vol_min_periods: 60
  sigma_target: train_median
  trend_sma: 50
  ewmac_pairs: [[16, 64], [32, 128]]
  ewmac_weights: [0.5, 0.5]
  fdm: 1.1
  forecast_abs_target: 10.0
  forecast_cap: 20.0
  random_paths: 1000

scaling:
  hard_cap: 2.0
  kelly_mode: "off"
  kelly_frac: 0.25
  mu_haircut: 0.5
  strategy_vol_halflife: 20
  liq_stress_drop: 0.50
  liq_proximity_max: 0.50
  k_search: [0.5, 5.0]
  stress_gap: -0.40
  stress_fin_spread: 0.10
features:
  blocks: [core]
  zscore_window: 365
  zscore_min_periods: 180
  clip: 4.0
  warmup_days: 400
  forbidden: [calendar, full_sample_stats, news, sentiment]
model: {}
training: {}
evolution: {}
validation:
  cpcv_blocks: 6
  cpcv_test_blocks: 2
  purge_days: 1
  embargo_days: 30
  embargo_sensitivity: [30, 90]
  walkforward_years: [2019, 2020, 2021, 2022]
  walkforward_gap_days: 30
  n_jobs: 5
  budget_total: 30
  budget_derivs: 15
stats:
  bootstrap_mean_block: 20
  bootstrap_n: 5000
  bootstrap_chunk: 500
  ci_level: 0.90
  pbo_groups: 16
  pbo_threshold: 0.30
  dsr_threshold: 0.90
