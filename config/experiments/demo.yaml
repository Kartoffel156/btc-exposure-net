# Demo config: validación rápida con SYN para smoke tests.
# No cuenta como intento (usar con --smoke o --dry-run).
experiment:
  assets: [SYN]
  pooling: single

validation:
  cpcv_blocks: 6
  cpcv_test_blocks: 2
  purge_days: 1
  embargo_days: 30
  walkforward_years: [2019, 2020, 2021, 2022]
  walkforward_gap_days: 30
  n_jobs: 1

model:
  arch: M1

training:
  max_steps: 50
  eval_every: 25
  n_seeds: 1
  window: 60
